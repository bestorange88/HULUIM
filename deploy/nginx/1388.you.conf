server
{
    listen 80;
    listen 443 ssl;
    listen 443 quic;
    http2 on;
    server_name 1388.you 1388.online 1388.store;
    index index.html index.htm;
    root /www/wwwroot/1388.you;
    include /www/server/panel/vhost/nginx/extension/1388.you/*.conf;
    
    #CERT-APPLY-CHECK--START
    include /www/server/panel/vhost/nginx/well-known/1388.you.conf;
    #CERT-APPLY-CHECK--END
    
    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    
    # Enable early hints for faster resource loading

    # Downloads directory - direct file serving, bypass SPA
    location /downloads/ {
        add_header Content-Disposition "attachment";
        add_header Cache-Control "no-cache";
    }

    # SPA routing support with optimized caching
    location / {
        try_files $uri $uri/ /index.html;
        
        # Add preload hints for critical resources
    }

    # Forbidden files/directories
    location ~ ^/(\.user.ini|\.htaccess|\.git|\.env|\.svn|\.project|LICENSE|README.md)
    {
        return 404;
    }

    # SSL certificate verification
    location ~ \.well-known{
        allow all;
    }

    # Images - aggressive caching with immutable for hashed assets
    location ~ .*\.(gif|jpg|jpeg|png|bmp|swf|webp|avif|ico)$
    {
        expires      365d;
        add_header Cache-Control "public, immutable";
        add_header Vary "Accept-Encoding";
        access_log off;
        log_not_found off;
    }

    # JS/CSS with hash in filename - immutable cache (1 year)
    location ~ /assets/.*\.(js|css)$
    {
        expires      365d;
        add_header Cache-Control "public, immutable";
        add_header Vary "Accept-Encoding";
        gzip_static on;
        access_log off;
        log_not_found off;
    }
    
    # Other JS/CSS - shorter cache
    location ~ .*\.(js|css)?$
    {
        expires      7d;
        add_header Cache-Control "public";
        add_header Vary "Accept-Encoding";
        gzip_static on;
        access_log off;
        log_not_found off;
    }
    
    # Fonts - long cache with CORS
    location ~ .*\.(woff|woff2|ttf|otf|eot)$
    {
        expires      365d;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*";
        add_header Vary "Accept-Encoding";
        gzip_static on;
        access_log off;
        log_not_found off;
    }
    
    # Service Worker - no cache
    location = /sw.js {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
    
    # Workbox - cache but allow updates
    location ~ workbox.*\.js$ {
        expires 7d;
        add_header Cache-Control "public";
    }
    
    # HTML - short cache with revalidation
    location ~ \.html$ {
        expires 1h;
        add_header Cache-Control "no-cache";
    }
    
    # index.html - must revalidate for SPA updates
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate";
    }
    
    # Manifest - short cache
    location = /manifest.webmanifest {
        expires 1h;
        add_header Cache-Control "no-cache";
        add_header Content-Type "application/manifest+json";
    }
    
    #HTTP_TO_HTTPS_START
    set $isRedcert 1;
    if ($server_port != 443) {
        set $isRedcert 2;
    }
    if ( $uri ~ /\.well-known/ ) {
        set $isRedcert 1;
    }
    if ($isRedcert != 1) {
        rewrite ^(/.*)$ https://$host$1 permanent;
    }
    #HTTP_TO_HTTPS_END
    ssl_certificate    /www/server/panel/vhost/cert/1388.you/fullchain.pem;
    ssl_certificate_key    /www/server/panel/vhost/cert/1388.you/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH+CHACHA20:EECDH+CHACHA20-draft:EECDH+AES128:RSA+AES128:EECDH+AES256:RSA+AES256:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets on;
    ssl_session_timeout 1d;
    ssl_early_data on;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Alt-Svc 'h3=":443"; ma=86400' always;
    error_page 497  https://$host$request_uri;

    access_log  /www/wwwlogs/1388.you.log;
    error_log  /www/wwwlogs/1388.you.error.log;
}
